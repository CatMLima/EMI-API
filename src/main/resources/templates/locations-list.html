<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>Locations</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body>
<div th:switch="${locations}">
  <h2 th:case="null">There are no locations.</h2>
  <div th:case="*">
    <h2 class="text-center">Locations</h2>
    <form th:action="@{/locations-list}" method="get">
      <div class="form-group">
        <label for="userCount">Find locations with max users</label>
        <input type="number" id="userCount" name="userCount" class="form-control" th:value="${userCount}" placeholder="Enter max user count">
      </div>
      <button type="submit" class="btn btn-primary">Apply Filter</button>
    </form>
    <a th:href="@{/locations-list}">
      <button class="btn btn-secondary" type="submit">Reset</button>
    </a>

    <table class="table table-striped table-bordered">
      <thead>
      <tr>
        <th>Building</th>
        <th>Users</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="location : ${locations}">
        <td th:text="${location.building}"></td>
        <td th:text="${location.userCount}"></td>
      </tr>
      </tbody>
    </table>

  </div>

  <a th:href="@{/feed}">
    <button class="btn btn-primary" type="submit">Back to Feed</button>
  </a>
</div>
</body>
</html>
