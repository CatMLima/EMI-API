<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link href="//cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.5.3/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container my-4">
    <!-- Header -->
    <div class="text-center">
        <h1 class="display-4">Welcome, <span th:text="${user.name}"></span>!</h1>
        <p class="lead">Your email: <span th:text="${user.email}"></span></p>
    </div>

    <!-- Profile Picture Section -->
    <div class="text-center my-4">
        <h2>Your Profile Picture</h2>
        <img id="picture" th:src="@{'/user/' + ${user.id} + '/profilePicture'}"
             alt="Profile Picture" class="rounded-circle" width="150" height="150" />
    </div>

    <!-- User Stats Section -->
    <div class="card my-4">
        <div class="card-body">
            <h4 class="card-title">Your Stats</h4>
            <p><strong>Current streak:</strong> <span th:text="${user.streak}"></span></p>
            <p><strong>Total study time:</strong> <span th:text="${totalActivityTime}"></span></p>
            <p><strong>Total completed activities:</strong> <span th:text="${activitiesCount}"></span></p>
            <p><strong>Average study session time:</strong> <span th:text="${averageTime}"></span></p>
            <p><strong>Favourite location:</strong> <span th:text="${favouriteLocation}"></span></p>
        </div>
    </div>

    <!-- Buttons Section -->
    <div class="text-center">
        <!-- View Activities Button -->
        <a th:href="@{/studyactivity-list}" class="btn btn-info m-2">
            View My Study Activities
        </a>

        <!-- Settings Button -->
        <form th:action="@{/settings}" method="get" class="d-inline">
            <button class="btn btn-secondary m-2">Go to Settings</button>
        </form>

        <!-- Back to Feed Button -->
        <a th:href="@{/feed}" class="btn btn-primary m-2">
            Back to Feed
        </a>
    </div>
</div>

</body>
</html>
