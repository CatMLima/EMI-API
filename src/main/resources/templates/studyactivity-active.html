<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>On Going Study Activity - Chronometer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .title {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .subject-info {
            font-size: 1.2em;
            margin-bottom: 20px;
        }
        .chronometer {
            text-align: center;
        }
        #timeDisplay {
            font-size: 2em;
            margin: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 1em;
            margin: 5px;
        }
        #stopButton {
            background-color: red;
            color: white;
            margin-top: 15px;
        }
    </style>
    <script>
        let time = /*[[${studyActivity.getDuration()}]]*/ 0;  // starting time in seconds

        function formatTime(seconds) {
            const hrs = String(Math.floor(seconds / 3600)).padStart(2, '0');
            const mins = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
            const secs = String(seconds % 60).padStart(2, '0');
            return `${hrs}:${mins}:${secs}`;
        }

        function updateDisplay() {
            time += 1; // Increment the time by 1 second
            document.getElementById('timeDisplay').textContent = formatTime(time);
        }

        function start() {
            updateDisplay(); // Initial display update
            intervalId = setInterval(updateDisplay, 1000);  // Start the interval
        }

    </script>
</head>
<body onload="start()">

<div class="title" th:text="${studyActivity.title}">Study Activity Title</div>
<div class="subject-info">
    Subject: <span th:text="${studyActivity.subjectName}">Subject Name</span> <br>
    ID: <span th:text="${studyActivity.subjectID}">Subject ID</span>
</div>

<div class="chronometer">
    <div id="timeDisplay" th:text="${studyActivity.getDuration()}">00:00:00</div>
    <form th:action="@{/studyactivity-finish/{id}(id=${studyActivity.id})}" method="post">
        <button class="btn btn-primary" type="submit">End Study Activity</button>
    </form>
</div>

<br>

<div> <!-- Go to feed -->
    <a th:href="@{/feed}">
        <button class="btn btn-primary" type="submit"> Back to Feed </button>
    </a>
</div>

</body>
</html>
