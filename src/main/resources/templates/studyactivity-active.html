<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>On Going Study Activity - Chronometer</title>
    <!-- Auto-refresh the page every 1 seconds -->
    <meta http-equiv="refresh" content="1">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .title {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .subject-info {
            font-size: 1.2em;
            margin-bottom: 20px;
        }
        .chronometer {
            text-align: center;
        }
        #timeDisplay {
            font-size: 2em;
            margin: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 1em;
            margin: 5px;
        }
        #stopButton {
            background-color: red;
            color: white;
            margin-top: 15px;
        }
    </style>

</head>
<body onload="start()">

<div class="title" th:text="${studyActivity.title}">Study Activity Title</div>
<div class="subject-info">
    Subject: <span th:text="${studyActivity.subjectName}">Subject Name</span> <br>
    ID: <span th:text="${studyActivity.subjectID}">Subject ID</span>
</div>

<div class="chronometer">
    <!-- <div id="timeDisplay" th:text="${studyActivity.getDuration().getSeconds()}">00:00:00</div> -->
    <h1 th:text="${studyActivity.getFormattedDuration()}"></h1>
    <form th:action="@{/studyactivity-finish/{id}(id=${studyActivity.id})}" method="post">
        <button class="btn btn-primary" type="submit">End Study Activity</button>
    </form>
</div>

<br>

<div> <!-- Go to feed -->
    <a th:href="@{/feed}">
        <button class="btn btn-primary" type="submit"> Back to Feed </button>
    </a>
</div>

</body>
</html>
