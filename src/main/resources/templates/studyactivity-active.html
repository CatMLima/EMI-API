<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
  <title>On Going Study Activity - Chronometer</title>
  <!-- Auto-refresh the page every 2 seconds
  Making it faster than that can cause problems with the finish study
  activity button, as the refresh happens and the button is ignored. -->
  <meta http-equiv="refresh" content="2">
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      height: 100vh;
      margin: 0;
    }
    .title {
      font-size: 1.5em;
      font-weight: bold;
      margin-bottom: 5px;
    }
    .subject-info {
      font-size: 1.2em;
      margin-bottom: 20px;
    }
    .chronometer {
      text-align: center;
    }
    button {
      padding: 10px 20px;
      font-size: 1em;
      margin: 5px;
    }
  </style>

</head>
<body>

<div class="title" th:text="${studyActivity.title}">Study Activity Title</div>
<div class="subject-info">
  Subject: <span th:text="${studyActivity.subjectName}">Subject Name</span> <br>
  ID: <span th:text="${studyActivity.subjectID}">Subject ID</span>
</div>

<div class="chronometer">
  <!-- Ongoing timer -->
  <h1 th:text="${studyActivity.getFormattedDuration()}"></h1>
  <form th:action="@{/studyactivity-finish/{id}(id=${studyActivity.id})}" method="post">
    <!-- End Study Activity button -->
    <button class="btn btn-primary" type="submit">End Study Activity</button>
  </form>
</div>

<br>

<div> <!-- Go to feed -->
  <a th:href="@{/feed}">
    <button class="btn btn-primary" type="submit"> Back to Feed </button>
  </a>
</div>

</body>
</html>
